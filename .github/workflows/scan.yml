      - name: Feed-Hunt Scan (auto dari feed global)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FEED_MODE: "1"
          FEED_EVENT_PAGES: "3"
          FEED_MAX_USERS: "8"
          FEED_MAX_REPOS_PER_USER: "2"
          FEED_MAX_TOTAL_REPOS: "12"
        run: python scanner.py feed
